name: eyecue_flutter
description: "EyeCue - Real-time object detection for visually impaired"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. Camera (used for availableCameras() sensor metadata)
  camera: ^0.12.0+1

  # 2. Audio Feedback
  flutter_tts: ^4.2.0
  
  # 4. Permissions (Bumped to 12.0.3)
  permission_handler: ^12.0.3

  # 5. Path Provider
  path_provider: ^2.1.4

  # 6. Data Visualization (For your Logs/Reports dashboard)
  fl_chart: ^1.2.0

  # 7. Alternative native YOLO pipeline (runtime-comparable with custom mode)
  ultralytics_yolo: 0.6.13
  marionette_flutter: ^0.6.0

  # 8. Offline IBM Plex Sans typography for the Home-local light theme
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/yolov8n_int8_new_metadata.tflite
    # Official Ultralytics depth model (yolo26n-depth, w8a32, v0.6.6). Bundled
    # so MDE runs offline without the INTERNET permission.
    - assets/yolo26n-depth_w8a32.tflite
    - assets/labels.txt
    # Home visual mark (decorative; wordmark stays live text).
    - assets/logo.png
    # Offline IBM Plex Sans fonts for the Home-local light theme.
    - assets/fonts/
