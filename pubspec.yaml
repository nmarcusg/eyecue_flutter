name: eyecue_flutter
description: "EyeCue - Real-time object detection for visually impaired"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. Camera (Bumped to 0.12.0+1)
  camera: ^0.12.0+1
  
  # 2. Machine Learning (Bumped to 0.12.1 - bundles newest TFLite)
  tflite_flutter: ^0.12.1
  
  # 3. Audio Feedback
  flutter_tts: ^4.2.0
  
  # 4. State Management (Keeping Riverpod at 2.6.1 for stability, as 3.x is very new and changes syntax)
  flutter_riverpod: ^3.3.2
  
  # 5. Permissions (Bumped to 12.0.3)
  permission_handler: ^12.0.3

  # 6. Path Provider
  path_provider: ^2.1.4

  # 7. Data Visualization (For your Logs/Reports dashboard)
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/yolov8n.tflite
    - assets/labels.txt
    # TEMPORARY (test-image mode): known-good RGB photo of COCO objects.
    # Remove together with the useTestImage flag.
    - assets/test_image.jpg
